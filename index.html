<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>단칸방의 오리온</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="단칸방의 오리온 프로토타입">
      <nav class="stage-jump-tabs" aria-label="스테이지 바로가기"></nav>

      <section class="title-screen" id="titleScreen" aria-label="메인 화면">
        <div class="title-canvas">
          <img
            class="title-background"
            src="./assets/images/main-screen.png"
            alt=""
            aria-hidden="true"
          />
          <div class="title-background-fallback" aria-hidden="true"></div>
          <img
            class="shooting-star"
            id="shootingStar"
            src="./assets/images/shooting-star.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="title-character title-layer"
            id="titleCharacter"
            src="./assets/images/title-bina-smoking.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="cigarette-light cigarette-light-a title-layer"
            src="./assets/images/cigarette-light-1.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="cigarette-light cigarette-light-b title-layer"
            src="./assets/images/cigarette-light-2.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="cigarette-smoke cigarette-smoke-a title-layer"
            src="./assets/images/cigarette-smoke-1.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="cigarette-smoke cigarette-smoke-b title-layer"
            src="./assets/images/cigarette-smoke-2.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="title-logo"
            src="./assets/images/title.png"
            alt="단칸방의 오리온"
          />
          <h1 class="title-logo-fallback">단칸방의 오리온</h1>
          <button class="start-prompt" id="startPrompt" type="button">PRESS TO START</button>
        </div>
      </section>

      <div class="encounter-wipe" id="encounterWipe" aria-hidden="true"></div>

      <section class="stage" id="stage" aria-label="게임 장면">
        <div class="stage-canvas">
          <img class="scene-background" id="sceneBackground" alt="" aria-hidden="true" />
          <div class="stage-actors" id="stageActors" aria-hidden="true"></div>
          <img class="stage-character" id="stageCharacter" alt="" aria-hidden="true" />
          <div class="stage-character-sheet" id="stageCharacterSheet" aria-hidden="true"></div>
          <div class="overhead-prompt" id="overheadPrompt" aria-hidden="true">
            <img
              class="overhead-prompt-frame advance-prompt-a"
              src="./assets/images/ui/a-key-1.png"
              alt=""
            />
            <img
              class="overhead-prompt-frame advance-prompt-b"
              src="./assets/images/ui/a-key-2.png"
              alt=""
            />
          </div>
          <div class="debug-area-layer" id="debugAreaLayer" aria-hidden="true">
            <div class="debug-move-bounds" id="debugMoveBounds"></div>
            <div id="debugInteractionBlocks"></div>
          </div>
        </div>
      </section>

      <div class="narration-panel narration-panel-hidden" id="narrationPanel">
        <p class="narration-text" id="narrationText"></p>
        <div class="narration-choices" id="narrationChoices"></div>
        <div class="narration-prompt" aria-hidden="true">
          <img
            class="advance-prompt-frame advance-prompt-a"
            src="./assets/images/ui/a-key-1.png"
            alt=""
          />
          <img
            class="advance-prompt-frame advance-prompt-b"
            src="./assets/images/ui/a-key-2.png"
            alt=""
          />
        </div>
      </div>

      <div class="sleep-wipe sleep-wipe-hidden" id="sleepWipe" aria-hidden="true">
        <div class="sleep-wipe-top"></div>
        <div class="sleep-wipe-bottom"></div>
      </div>

      <section class="schedule-mini-hud schedule-mini-hud-hidden" id="scheduleMiniHud" aria-label="일정 상태">
        <span id="miniDay">2일차</span>
        <span id="miniTimeSlot">아침</span>
        <span id="miniMoney">0원</span>
        <span id="miniFatigue">피로 0</span>
        <button type="button" id="scheduleStatusButton">상태창</button>
      </section>

      <div class="cutscene" id="cutscene" aria-hidden="true">
        <video class="cutscene-video" id="cutsceneVideo" playsinline muted></video>
      </div>

      <nav class="save-controls" id="saveControls" aria-label="save controls">
        <button type="button" data-save-action="quick-save">Q.SAVE</button>
        <button type="button" data-save-action="quick-load">Q.LODE</button>
        <button type="button" data-save-action="save">SAVE</button>
        <button type="button" data-save-action="load">LODE</button>
        <button type="button" data-save-action="auto" id="autoModeButton">AUTO</button>
      </nav>

      <section class="save-modal save-modal-hidden" id="saveModal" aria-label="save menu">
        <div class="save-modal-panel">
          <div class="save-modal-header">
            <strong id="saveModalTitle">SAVE</strong>
            <button type="button" class="save-modal-close" id="saveModalClose">X</button>
          </div>
          <div class="save-slots" id="saveSlots"></div>
          <div class="save-pages" id="savePages">
            <button type="button" data-save-page="0">1</button>
            <button type="button" data-save-page="1">2</button>
            <button type="button" data-save-page="2">3</button>
          </div>
        </div>
      </section>

      <div class="dialogue-actors dialogue-actors-hidden" id="dialogueActors" aria-hidden="true"></div>

      <section class="system-panel system-panel-hidden" id="systemPanel" aria-label="system message">
        <strong class="system-title">SYSTEM</strong>
        <p class="system-text" id="systemText"></p>
        <div class="system-prompt" id="systemPrompt" aria-hidden="true">
          <img
            class="advance-prompt-frame advance-prompt-a"
            src="./assets/images/ui/a-key-1.png"
            alt=""
          />
          <img
            class="advance-prompt-frame advance-prompt-b"
            src="./assets/images/ui/a-key-2.png"
            alt=""
          />
        </div>
      </section>

      <section class="schedule-panel schedule-panel-hidden" id="schedulePanel" aria-label="30일 일정 관리">
        <div class="schedule-header">
          <div>
            <strong id="scheduleTitle">2일차 아침</strong>
            <span id="scheduleSubtitle">오늘의 행동을 선택한다.</span>
          </div>
          <button type="button" id="scheduleClose">닫기</button>
        </div>
        <div class="schedule-stats" id="scheduleStats"></div>
        <div class="schedule-body" id="scheduleBody"></div>
        <div class="schedule-log" id="scheduleLog"></div>
      </section>

      <section class="hud">
        <div class="portrait-frame" id="portraitFrame" aria-hidden="true">
          <img class="portrait" id="portrait" alt="" />
        </div>
        <div class="dialogue-panel">
          <div class="dialogue-image-controls" id="dialogueImageControls">
            <label>
              인게임
              <select id="debugStageSprite"></select>
            </label>
            <label>
              초상화
              <select id="debugPortraitSprite"></select>
            </label>
          </div>
          <div class="speaker" id="speaker">이빛나</div>
          <p class="dialogue" id="dialogue"></p>
          <div class="choices" id="choices"></div>
          <div class="advance-prompt" id="advancePrompt" aria-hidden="true">
            <img
              class="advance-prompt-frame advance-prompt-a"
              src="./assets/images/ui/a-key-1.png"
              alt=""
            />
            <img
              class="advance-prompt-frame advance-prompt-b"
              src="./assets/images/ui/a-key-2.png"
              alt=""
            />
          </div>
        </div>
      </section>

      <aside class="debug-panel" id="debugPanel" aria-label="캐릭터와 대화창 조절 패널">
        <button class="debug-panel-tab" id="debugPanelTab" type="button" aria-label="디버그 패널 열기">DEBUG</button>
        <div class="debug-panel-header" data-drag-handle>
          <strong>캐릭터 / 대화창</strong>
          <button class="debug-copy" id="copyTuning" type="button">복사</button>
        </div>

        <label>
          조절 맵
          <select class="debug-stage-select" id="debugCharacterStage">
            <option value="roomMorning">방 아침</option>
            <option value="roomAfternoon">방 점심</option>
            <option value="roomEvening">방 저녁</option>
            <option value="room6">방 컷신 6</option>
            <option value="room7">방 컷신 7</option>
            <option value="room8">방 잠들기 컷신</option>
            <option value="room9">방 세수 컷신</option>
            <option value="roof3">옥상 컷신 3</option>
            <option value="roof4">옥상 컷신 4</option>
            <option value="roof5">옥상 컷신 5</option>
            <option value="roof6">옥상 컷신 6</option>
            <option value="aptMorning">건물 내부 아침</option>
            <option value="aptAfternoon">건물 내부 점심</option>
            <option value="aptNight">건물 내부 밤</option>
            <option value="withU">편의점</option>
            <option value="sanMorning">뒷산 아침</option>
            <option value="sanAfternoon">뒷산 점심</option>
            <option value="sanNight">뒷산 밤</option>
            <option value="room">방안</option>
            <option value="room2">방 컷신 2</option>
            <option value="room3">방 컷신 3</option>
            <option value="room4">방 컷신 4</option>
            <option value="room5">방 컷신 5</option>
            <option value="roof">옥상</option>
            <option value="roof2">옥상 별 이동</option>
            <option value="crash">추락 직후</option>
            <option value="alien">외계인 등장</option>
          </select>
        </label>

        <label>
          캐릭터 X
          <input id="stageX" type="range" min="-20" max="120" value="49" step="1" />
        </label>
        <label>
          캐릭터 Y
          <input id="stageY" type="range" min="-20" max="120" value="36" step="0.1" />
        </label>
        <label>
          캐릭터 크기
          <input id="stageSize" type="range" min="4" max="40" value="13.8" step="0.1" />
        </label>
        <label>
          캐릭터 가로 비율
          <input id="stageScaleX" type="range" min="40" max="220" value="100" step="1" />
        </label>
        <label>
          캐릭터 세로 비율
          <input id="stageScaleY" type="range" min="40" max="220" value="100" step="1" />
        </label>
        <label>
          Stage Flip X
          <input id="stageFlipX" type="checkbox" />
        </label>

        <label>
          조절 캐릭터
          <select id="debugCharacter">
            <option value="cupramuen">cupramuen</option>
            <option value="bina">이빛나</option>
            <option value="pyong">뿅뿅</option>
            <option value="cheolsu">김철수</option>
            <option value="starship">별/우주선</option>
            <option value="starshipCrash">추락한 별/우주선</option>
            <option value="starshipOpen">열린 별/우주선</option>
          </select>
        </label>

        <label>
          초상화 X
          <input id="portraitX" type="range" min="0" max="100" value="48" step="1" />
        </label>
        <label>
          초상화 Y
          <input id="portraitY" type="range" min="0" max="100" value="23" step="1" />
        </label>
        <label>
          초상화 확대
          <input id="portraitZoom" type="range" min="80" max="220" value="170" step="1" />
        </label>

        <label>
          대화창 불투명도
          <input id="dialogueOpacity" type="range" min="0" max="1" value="1" step="0.01" />
        </label>
        <label>
          대화창 너비
          <input id="dialogueWidth" type="range" min="45" max="100" value="100" step="1" />
        </label>
        <label>
          대화창 높이
          <input id="dialogueHeight" type="range" min="0" max="360" value="0" step="1" />
        </label>
        <label>
          대화창 여백
          <input id="dialoguePadding" type="range" min="0" max="40" value="16" step="1" />
        </label>
        <label>
          대화창 X
          <input id="dialogueX" type="range" min="0" max="100" value="50" step="1" />
        </label>
        <label>
          대화창 Y
          <input id="dialogueY" type="range" min="-10" max="40" value="4" step="0.5" />
        </label>
        <label>
          A키 X
          <input id="advancePromptX" type="range" min="0" max="120" value="96" step="1" />
        </label>
        <label>
          A키 Y
          <input id="advancePromptY" type="range" min="0" max="120" value="84" step="1" />
        </label>
        <label>
          A키 크기
          <input id="advancePromptSize" type="range" min="1" max="12" value="7.7" step="0.1" />
        </label>
        <label>
          대화 스탠딩 활성 X
          <input id="dialogueActiveX" type="range" min="-20" max="120" value="50" step="0.5" />
        </label>
        <label>
          대화 스탠딩 비활성 X
          <input id="dialogueInactiveX" type="range" min="-20" max="120" value="50" step="0.5" />
        </label>
        <label>
          대화 스탠딩 Y
          <input id="dialogueStandingY" type="range" min="0" max="120" value="70" step="0.5" />
        </label>
        <label>
          대화 스탠딩 크기
          <input id="dialogueStandingSize" type="range" min="5" max="80" value="25" step="0.5" />
        </label>
        <label>
          강조 스케일
          <input id="dialogueFocusScale" type="range" min="0.5" max="2" value="1.08" step="0.01" />
        </label>
        <label>
          비강조 스케일
          <input id="dialogueMutedScale" type="range" min="0.5" max="2" value="0.95" step="0.01" />
        </label>
        <label>
          대화 스탠딩 좌우반전
          <input id="dialogueFlipX" type="checkbox" />
        </label>
        <label>
          카메라 X
          <input type="range" min="-80" max="80" value="0" step="1" data-camera-field="cameraX" />
        </label>
        <label>
          카메라 Y
          <input type="range" min="-80" max="80" value="0" step="1" data-camera-field="cameraY" />
        </label>
        <label>
          카메라 확대
          <input type="range" min="0.5" max="5" value="1" step="0.01" data-camera-field="cameraZoom" />
        </label>
        <label>
          카메라 이동 시간
          <input type="range" min="0" max="4000" value="650" step="50" data-camera-field="cameraDuration" />
        </label>
        <label>
          Debug Area
          <input id="debugAreasVisible" type="checkbox" />
        </label>
        <label>
          Move Left
          <input id="walkBoundLeft" type="range" min="0" max="100" value="26" step="1" />
        </label>
        <label>
          Move Right
          <input id="walkBoundRight" type="range" min="0" max="100" value="73" step="1" />
        </label>
        <label>
          Move Top
          <input id="walkBoundTop" type="range" min="0" max="100" value="33" step="1" />
        </label>
        <label>
          Move Bottom
          <input id="walkBoundBottom" type="range" min="0" max="100" value="83" step="1" />
        </label>
        <div class="debug-actions">
          <button type="button" id="addInteractionBlock">Block Add</button>
          <button type="button" id="removeInteractionBlock">Block Remove</button>
        </div>
        <label>
          Block
          <select id="debugBlockSelect"></select>
        </label>
        <label>
          Block X
          <input id="debugBlockX" type="range" min="0" max="100" value="45" step="1" />
        </label>
        <label>
          Block Y
          <input id="debugBlockY" type="range" min="0" max="100" value="45" step="1" />
        </label>
        <label>
          Block W
          <input id="debugBlockWidth" type="range" min="1" max="100" value="10" step="1" />
        </label>
        <label>
          Block H
          <input id="debugBlockHeight" type="range" min="1" max="100" value="10" step="1" />
        </label>
        <label>
          Block Text
          <input id="debugBlockText" type="text" value="" />
        </label>
        <label>
          Block Next
          <input id="debugBlockNext" type="text" value="" />
        </label>
        <pre class="debug-output" id="debugOutput"></pre>
      </aside>

    </main>

    <script src="./story.js"></script>
    <script src="./scheduleData.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
